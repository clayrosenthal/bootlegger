[daemons.local]
run = "uv run bootlegger --port $PORT"
port = { expect = [8000], bump = 10 }
ready_port = 8000

[daemons.docker]
run = "docker run --rm --name bootlegger -p $PORT:8000 bootlegger:latest"
port = { expect = [8000], bump = 10 }
ready_port = 8000
hooks = { on_stop = "docker stop bootlegger" }
